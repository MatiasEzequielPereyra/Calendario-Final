<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Ingresar - Quinta MeWen</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="login-page">

  <div class="login-container">
    <div class="login-card">
      <div class="login-logo">🏡</div>
      <h1>Quinta MeWen</h1>
      <p>Panel de Reservas</p>

      <form id="loginForm">
        <div class="form-group">
          <label for="usuario">Usuario</label>
          <input type="text" id="usuario" placeholder="Usuario" autocomplete="username" required>
        </div>

        <div class="form-group">
          <label for="password">Contraseña</label>
          <input type="password" id="password" placeholder="Contraseña" autocomplete="current-password" required>
        </div>

        <button type="submit" class="btn-success login-button">Ingresar</button>
        <div id="loginError" class="login-error"></div>
      </form>
    </div>
  </div>

  <script src="auth.js"></script>
  <script>
    document.getElementById('loginForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const usuario = document.getElementById('usuario').value.trim();
      const password = document.getElementById('password').value;
      const errorDiv = document.getElementById('loginError');

      if (Auth.login(usuario, password)) {
        window.location.href = 'index.html';
      } else {
        errorDiv.textContent = 'Usuario o contraseña incorrectos';
        document.getElementById('password').value = '';
        document.getElementById('password').focus();
      }
    });

    if (Auth.estaAutenticado()) {
      window.location.replace('index.html');
    }
  </script>
</body>
</html>
